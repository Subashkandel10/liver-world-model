[project]
name = "lwm"
version = "0.1.0"
description = "Digital Liver World Model — a JEPA-style predictive world model with by-construction clinical constraints"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["lwm"]
